<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - JoJo's Bizarre Adventure</title>
    <link type="text/css" href="estiloNavegacion.css" rel="stylesheet">
</head>

<body>

<ul>
    <li><a href="menuNavegación.html">Inicio</a></li>
    <li><a href="galeriaNavegacion.html">Galería</a></li>
    <li><a href="formularioNavegacion.html">Formulario</a></li>
</ul>

<div class="formulario">

    <h1>Formulario JoJo</h1>

    <p>Cuéntanos tus preferencias sobre JoJo's Bizarre Adventure.</p>

    <form>

        <label>Nombre:</label>
        <input type="text" name="nombre">

        <label>Correo electrónico:</label>
        <input type="email" name="correo">

        <label>¿Cuál es tu parte favorita?</label>

        <select name="parte">

            <option>Parte 1 - Phantom Blood</option>
            <option>Parte 2 - Battle Tendency</option>
            <option>Parte 3 - Stardust Crusaders</option>
            <option>Parte 4 - Diamond is Unbreakable</option>
            <option>Parte 5 - Golden Wind</option>
            <option>Parte 6 - Stone Ocean</option>
            <option>Parte 7 - Steel Ball Run</option>
            <option>Parte 8 - JoJolion</option>
            <option>Parte 9 - The JOJOLands</option>

        </select>

        <label>De la galería, ¿cuál es tu personaje favorito?</label>

        <select name="personaje">

            <option>Kars</option>
            <option>DIO</option>
            <option>Yoshikage Kira</option>
            <option>Enrico Pucci</option>
            <option>Diego Brando</option>
            <option>Funny Valentine</option>
            <option>Otro fuera de la lista</option>

        </select>

        <label>¿Cuál es tu Stand favorito?</label>

        <input type="text" name="stand" placeholder="Ejemplo: Star Platinum">

        <label>¿Qué opinas de la página?</label>

        <textarea name="mensaje" placeholder="Escribe aquí tu opinión..."></textarea>

        <input class="boton" type="submit" value="Enviar">

    </form>

</div>

</body>

</html>
